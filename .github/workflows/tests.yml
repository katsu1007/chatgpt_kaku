name: KAKU regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest validation active for each PR/branch.
# Rapid follow-up commits cancel obsolete in-flight runs instead of sending
# a separate failure notification for every intermediate state.
concurrency:
  group: kaku-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find js original -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run regression and HTML entry tests
        run: node --experimental-default-type=module --test tests/*.test.mjs
